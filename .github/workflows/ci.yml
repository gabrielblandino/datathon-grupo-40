name: Datathon CI

on:
  push:
    paths: ['generator/**', 'tests/**', 'evaluation/**']
  pull_request:
    paths: ['generator/**', 'tests/**', 'evaluation/**']

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check generator/ tests/ evaluation/

      - name: Type check (mypy)
        run: mypy generator/ --ignore-missing-imports

      - name: Security scan (bandit)
        run: bandit -r generator/ -c pyproject.toml

      - name: Unit tests (pytest)
        run: |
          pytest tests/ -x \
          --cov=generator \
          --cov-report=xml \
          --cov-fail-under=60 \
          --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml