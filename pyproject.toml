[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datathon-fase05"
version = "1.0.0"
description = "Plataforma de MLOps e LLM Agents - Datathon Fase 05"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "mlflow>=2.5.0",
    "pandera>=0.16.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "langchain==0.1.20",
    "langchain-openai==0.0.8",
    "langchain-community==0.0.38",
    "langsmith==0.1.147",
    "presidio-analyzer>=2.2.35",
    "presidio-anonymizer>=2.2.35",
    "evidently==0.4.33",
    "ragas>=0.1.0",
    "prometheus-client>=0.17.1",
    "datasets>=2.14.4",
    "openpyxl>=3.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "bandit>=1.7.5",
    "dvc"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["generator*", "evaluation*"]
exclude = ["notebooks*", "configs*"]

[tool.pytest.ini_options]
addopts = "-v --cov=generator --cov-report=xml --cov-report=term"
testpaths = ["tests"]